version: '3.8'

services:
  # Applications
  app-mvc:
    build: 
      context: ./app-mvc-java
      dockerfile: Dockerfile
    container_name: app-mvc
    ports:
      - "8081:8081"
    environment:
      - SERVER_PORT=8081
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/playground
      - TOMCAT_THREADS_MAX=${TOMCAT_THREADS_MAX:-500}
    networks:
      - playground-net
    depends_on:
      - postgres
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  app-webflux-java:
    build: 
      context: ./app-webflux-java
      dockerfile: Dockerfile
    container_name: app-webflux-java
    ports:
      - "8082:8082"
    environment:
      - SERVER_PORT=8082
      - SPRING_R2DBC_URL=r2dbc:postgresql://postgres:5432/playground
    networks:
      - playground-net
    depends_on:
      - postgres
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  app-webflux-kotlin:
    build: 
      context: ./app-webflux-kotlin
      dockerfile: Dockerfile
    container_name: app-webflux-kotlin
    ports:
      - "8083:8083"
    environment:
      - SERVER_PORT=8083
    networks:
      - playground-net
    depends_on:
      - postgres

  postgres:
    image: postgres:15-alpine
    container_name: postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=playground
    networks:
      - playground-net

  # Observability
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-lifecycle
    networks:
      - playground-net
    depends_on:
      - app-mvc
      - app-webflux-java
      - app-webflux-kotlin

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards
    networks:
      - playground-net
    depends_on:
      - prometheus

networks:
  playground-net:
    driver: bridge
